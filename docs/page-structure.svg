<svg width="800" height="900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #2c3e50; }
      .section-title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #34495e; }
      .label { font-family: Arial, sans-serif; font-size: 12px; fill: #2c3e50; }
      .bit-label { font-family: Arial, sans-serif; font-size: 10px; fill: #7f8c8d; }
      .address { font-family: 'Courier New', monospace; font-size: 10px; fill: #e74c3c; }
      .description { font-family: Arial, sans-serif; font-size: 11px; fill: #34495e; }
      .header-box { fill: #3498db; stroke: #2980b9; stroke-width: 2; }
      .pte-box { fill: #ecf0f1; stroke: #34495e; stroke-width: 1; }
      .bit-box { fill: #f8f9fa; stroke: #bdc3c7; stroke-width: 1; }
      .flag-box { fill: #e8f5e8; stroke: #27ae60; stroke-width: 1; }
      .addr-box { fill: #fff3cd; stroke: #ffc107; stroke-width: 1; }
      .page-box { fill: #f0f8ff; stroke: #4682b4; stroke-width: 1; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e" />
    </marker>
  </defs>
  
  <!-- 标题 -->
  <rect x="50" y="20" width="700" height="40" class="header-box" rx="5" />
  <text x="400" y="45" text-anchor="middle" class="title">xv6 页表结构与页组织</text>
  
  <!-- 页表项 (PTE) 结构 -->
  <rect x="50" y="80" width="700" height="30" class="header-box" rx="3" />
  <text x="70" y="100" class="section-title">1. 页表项 (PTE) 结构 - 64位</text>
  
  <!-- PTE 位字段图 -->
  <rect x="50" y="120" width="700" height="80" class="pte-box" rx="3" />
  
  <!-- 物理页号 (PPN) -->
  <rect x="60" y="130" width="400" height="25" class="addr-box" rx="2" />
  <text x="260" y="147" text-anchor="middle" class="label">物理页号 (PPN) [53:10]</text>
  <text x="260" y="160" text-anchor="middle" class="bit-label">44 位 - 物理页面地址</text>
  
  <!-- 保留位 -->
  <rect x="470" y="130" width="80" height="25" class="bit-box" rx="2" />
  <text x="510" y="147" text-anchor="middle" class="label">RSW [9:8]</text>
  <text x="510" y="160" text-anchor="middle" class="bit-label">保留位</text>
  
  <!-- 标志位 -->
  <rect x="560" y="130" width="180" height="25" class="flag-box" rx="2" />
  <text x="650" y="147" text-anchor="middle" class="label">标志位 [7:0]</text>
  <text x="650" y="160" text-anchor="middle" class="bit-label">D A G U X W R V</text>
  
  <!-- 标志位详细说明 -->
  <rect x="60" y="170" width="680" height="25" class="bit-box" rx="2" />
  <text x="70" y="185" class="description">V:有效 R:可读 W:可写 X:可执行 U:用户可访问 G:全局 A:已访问 D:已修改</text>
  
  <!-- 虚拟地址结构 -->
  <rect x="50" y="220" width="700" height="30" class="header-box" rx="3" />
  <text x="70" y="240" class="section-title">2. 虚拟地址结构 (Sv39) - 39位有效地址</text>
  
  <rect x="50" y="260" width="700" height="100" class="pte-box" rx="3" />
  
  <!-- VPN[2] -->
  <rect x="60" y="270" width="150" height="25" class="addr-box" rx="2" />
  <text x="135" y="287" text-anchor="middle" class="label">VPN[2] [38:30]</text>
  <text x="135" y="300" text-anchor="middle" class="bit-label">9位 - L2页表索引</text>
  
  <!-- VPN[1] -->
  <rect x="220" y="270" width="150" height="25" class="addr-box" rx="2" />
  <text x="295" y="287" text-anchor="middle" class="label">VPN[1] [29:21]</text>
  <text x="295" y="300" text-anchor="middle" class="bit-label">9位 - L1页表索引</text>
  
  <!-- VPN[0] -->
  <rect x="380" y="270" width="150" height="25" class="addr-box" rx="2" />
  <text x="455" y="287" text-anchor="middle" class="label">VPN[0] [20:12]</text>
  <text x="455" y="300" text-anchor="middle" class="bit-label">9位 - L0页表索引</text>
  
  <!-- 页内偏移 -->
  <rect x="540" y="270" width="150" height="25" class="page-box" rx="2" />
  <text x="615" y="287" text-anchor="middle" class="label">页内偏移 [11:0]</text>
  <text x="615" y="300" text-anchor="middle" class="bit-label">12位 - 4KB页内地址</text>
  
  <!-- 地址转换示例 -->
  <rect x="60" y="320" width="680" height="35" class="bit-box" rx="2" />
  <text x="70" y="335" class="description">示例: 虚拟地址 0x12345678</text>
  <text x="70" y="350" class="address">VPN[2]=0x048 VPN[1]=0x1A2 VPN[0]=0x345 偏移=0x678</text>
  
  <!-- 页表层次结构 -->
  <rect x="50" y="380" width="700" height="30" class="header-box" rx="3" />
  <text x="70" y="400" class="section-title">3. 三级页表层次结构</text>
  
  <!-- L2 页表 -->
  <rect x="60" y="430" width="180" height="80" class="page-box" rx="3" />
  <text x="150" y="450" text-anchor="middle" class="label">L2 页表 (根页表)</text>
  <text x="150" y="465" text-anchor="middle" class="description">512个PTE</text>
  <text x="150" y="480" text-anchor="middle" class="description">VPN[2]作为索引</text>
  <text x="150" y="495" text-anchor="middle" class="address">satp寄存器指向</text>
  
  <!-- L1 页表 -->
  <rect x="280" y="430" width="180" height="80" class="page-box" rx="3" />
  <text x="370" y="450" text-anchor="middle" class="label">L1 页表</text>
  <text x="370" y="465" text-anchor="middle" class="description">512个PTE</text>
  <text x="370" y="480" text-anchor="middle" class="description">VPN[1]作为索引</text>
  <text x="370" y="495" text-anchor="middle" class="address">L2 PTE指向</text>
  
  <!-- L0 页表 -->
  <rect x="500" y="430" width="180" height="80" class="page-box" rx="3" />
  <text x="590" y="450" text-anchor="middle" class="label">L0 页表 (叶子)</text>
  <text x="590" y="465" text-anchor="middle" class="description">512个PTE</text>
  <text x="590" y="480" text-anchor="middle" class="description">VPN[0]作为索引</text>
  <text x="590" y="495" text-anchor="middle" class="address">L1 PTE指向</text>
  
  <!-- 箭头 -->
  <line x1="240" y1="470" x2="280" y2="470" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="460" y1="470" x2="500" y2="470" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)" />
  
  <!-- 物理页面 -->
  <rect x="60" y="530" width="620" height="80" class="addr-box" rx="3" />
  <text x="370" y="550" text-anchor="middle" class="label">物理页面 (4KB)</text>
  <text x="370" y="565" text-anchor="middle" class="description">L0 PTE的PPN字段指向实际的物理页面</text>
  <text x="370" y="580" text-anchor="middle" class="description">页内偏移直接用于访问页面内的具体字节</text>
  <text x="370" y="595" text-anchor="middle" class="address">物理地址 = PPN << 12 | 页内偏移</text>
  
  <!-- 箭头指向物理页面 -->
  <line x1="590" y1="510" x2="370" y2="530" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)" />
  
  <!-- 页面大小和对齐 -->
  <rect x="50" y="630" width="700" height="30" class="header-box" rx="3" />
  <text x="70" y="650" class="section-title">4. 页面特性</text>
  
  <rect x="50" y="670" width="700" height="120" class="pte-box" rx="3" />
  
  <!-- 页面大小 -->
  <rect x="70" y="685" width="200" height="25" class="page-box" rx="2" />
  <text x="170" y="702" text-anchor="middle" class="label">页面大小: 4KB (4096字节)</text>
  
  <!-- 页面对齐 -->
  <rect x="290" y="685" width="200" height="25" class="page-box" rx="2" />
  <text x="390" y="702" text-anchor="middle" class="label">页面对齐: 4KB边界</text>
  
  <!-- 页表大小 -->
  <rect x="510" y="685" width="200" height="25" class="page-box" rx="2" />
  <text x="610" y="702" text-anchor="middle" class="label">页表大小: 4KB (512个PTE)</text>
  
  <!-- 地址空间 -->
  <rect x="70" y="720" width="300" height="25" class="addr-box" rx="2" />
  <text x="220" y="737" text-anchor="middle" class="label">虚拟地址空间: 512GB (2^39)</text>
  
  <!-- 物理地址空间 -->
  <rect x="390" y="720" width="300" height="25" class="addr-box" rx="2" />
  <text x="540" y="737" text-anchor="middle" class="label">物理地址空间: 最大 256TB (2^48)</text>
  
  <!-- 页表项数量 -->
  <rect x="70" y="750" width="620" height="25" class="bit-box" rx="2" />
  <text x="380" y="767" text-anchor="middle" class="description">每级页表: 512个条目 (2^9) | 最大页面数: 512^3 = 134,217,728 页</text>
  
  <!-- 关键概念总结 -->
  <rect x="50" y="810" width="700" height="70" class="header-box" rx="3" />
  <text x="70" y="830" class="section-title">关键概念：</text>
  <text x="70" y="850" class="description">• 页表项 (PTE): 64位，包含44位物理页号和8位标志位</text>
  <text x="70" y="865" class="description">• 三级页表: L2(根) → L1 → L0(叶子)，每级512个条目</text>
  <text x="400" y="850" class="description">• 地址转换: 虚拟地址通过三级页表查找得到物理地址</text>
  <text x="400" y="865" class="description">• 页面管理: 4KB页面，4KB对齐，支持权限控制</text>
</svg>