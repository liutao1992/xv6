<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #2c3e50; }
      .function { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #34495e; }
      .step { font-family: Arial, sans-serif; font-size: 12px; fill: #2c3e50; }
      .comment { font-family: Arial, sans-serif; font-size: 10px; fill: #7f8c8d; }
      .box { fill: #ecf0f1; stroke: #34495e; stroke-width: 2; }
      .step-box { fill: #3498db; stroke: #2980b9; stroke-width: 1; }
      .memory-box { fill: #e74c3c; stroke: #c0392b; stroke-width: 1; }
      .device-box { fill: #f39c12; stroke: #e67e22; stroke-width: 1; }
      .kernel-box { fill: #27ae60; stroke: #229954; stroke-width: 1; }
      .arrow { stroke: #34495e; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e" />
    </marker>
  </defs>
  
  <!-- 标题 -->
  <text x="400" y="25" text-anchor="middle" class="title">kvmmake 函数结构图</text>
  
  <!-- 函数入口 -->
  <rect x="350" y="40" width="100" height="30" class="box" />
  <text x="400" y="60" text-anchor="middle" class="function">kvmmake()</text>
  
  <!-- 步骤1: 分配页表 -->
  <rect x="320" y="90" width="160" height="40" class="step-box" />
  <text x="400" y="110" text-anchor="middle" class="step">1. 分配页表根页面</text>
  <text x="400" y="125" text-anchor="middle" class="comment">kalloc() + memset()</text>
  
  <!-- 步骤2: 设备映射 -->
  <rect x="50" y="160" width="140" height="300" class="device-box" />
  <text x="120" y="180" text-anchor="middle" class="step">2. 设备寄存器映射</text>
  
  <!-- UART -->
  <rect x="60" y="190" width="120" height="30" class="box" />
  <text x="120" y="210" text-anchor="middle" class="comment">UART 寄存器</text>
  
  <!-- VIRTIO -->
  <rect x="60" y="230" width="120" height="30" class="box" />
  <text x="120" y="250" text-anchor="middle" class="comment">VIRTIO 磁盘接口</text>
  
  <!-- PLIC -->
  <rect x="60" y="270" width="120" height="30" class="box" />
  <text x="120" y="290" text-anchor="middle" class="comment">PLIC 中断控制器</text>
  
  <!-- 步骤3: 内核映射 -->
  <rect x="220" y="160" width="140" height="300" class="kernel-box" />
  <text x="290" y="180" text-anchor="middle" class="step">3. 内核代码/数据映射</text>
  
  <!-- 内核代码 -->
  <rect x="230" y="190" width="120" height="30" class="box" />
  <text x="290" y="210" text-anchor="middle" class="comment">内核代码段</text>
  
  <!-- 内核数据 -->
  <rect x="230" y="230" width="120" height="30" class="box" />
  <text x="290" y="250" text-anchor="middle" class="comment">内核数据段</text>
  
  <!-- 物理内存 -->
  <rect x="230" y="270" width="120" height="30" class="box" />
  <text x="290" y="290" text-anchor="middle" class="comment">物理内存</text>
  
  <!-- 步骤4: 特殊映射 -->
  <rect x="390" y="160" width="140" height="300" class="memory-box" />
  <text x="460" y="180" text-anchor="middle" class="step">4. 特殊区域映射</text>
  
  <!-- 跳板 -->
  <rect x="400" y="190" width="120" height="30" class="box" />
  <text x="460" y="210" text-anchor="middle" class="comment">陷阱跳板</text>
  
  <!-- 步骤5: 进程栈 -->
  <rect x="560" y="160" width="140" height="300" class="step-box" />
  <text x="630" y="180" text-anchor="middle" class="step">5. 进程内核栈</text>
  
  <!-- 进程栈 -->
  <rect x="570" y="190" width="120" height="30" class="box" />
  <text x="630" y="210" text-anchor="middle" class="comment">proc_mapstacks()</text>
  
  <!-- 返回结果 -->
  <rect x="320" y="490" width="160" height="40" class="box" />
  <text x="400" y="510" text-anchor="middle" class="step">返回内核页表</text>
  <text x="400" y="525" text-anchor="middle" class="comment">pagetable_t kpgtbl</text>
  
  <!-- 箭头连接 -->
  <line x1="400" y1="70" x2="400" y2="90" class="arrow" />
  <line x1="400" y1="130" x2="120" y2="160" class="arrow" />
  <line x1="400" y1="130" x2="290" y2="160" class="arrow" />
  <line x1="400" y1="130" x2="460" y2="160" class="arrow" />
  <line x1="400" y1="130" x2="630" y2="160" class="arrow" />
  
  <line x1="120" y1="460" x2="400" y2="490" class="arrow" />
  <line x1="290" y1="460" x2="400" y2="490" class="arrow" />
  <line x1="460" y1="460" x2="400" y2="490" class="arrow" />
  <line x1="630" y1="460" x2="400" y2="490" class="arrow" />
  
  <!-- 内存布局说明 -->
  <text x="50" y="560" class="comment">内存布局特点：</text>
  <text x="50" y="575" class="comment">• 直接映射：虚拟地址 = 物理地址</text>
  <text x="300" y="575" class="comment">• 权限分离：代码只读，数据可写</text>
  <text x="550" y="575" class="comment">• 设备映射：MMIO 区域</text>
</svg>