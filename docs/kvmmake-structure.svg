<svg width="700" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #2c3e50; }
      .step-title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #34495e; }
      .step-text { font-family: Arial, sans-serif; font-size: 12px; fill: #2c3e50; }
      .sub-item { font-family: Arial, sans-serif; font-size: 11px; fill: #7f8c8d; }
      .code { font-family: 'Courier New', monospace; font-size: 10px; fill: #e74c3c; }
      .header-box { fill: #3498db; stroke: #2980b9; stroke-width: 2; }
      .step-box { fill: #ecf0f1; stroke: #34495e; stroke-width: 1; }
      .sub-box { fill: #f8f9fa; stroke: #bdc3c7; stroke-width: 1; }
      .bullet { fill: #34495e; }
    </style>
  </defs>
  
  <!-- 标题 -->
  <rect x="50" y="20" width="600" height="40" class="header-box" rx="5" />
  <text x="350" y="45" text-anchor="middle" class="title">kvmmake() 函数执行流程</text>
  
  <!-- 步骤1: 分配页表 -->
  <rect x="50" y="80" width="600" height="50" class="step-box" rx="3" />
  <circle cx="70" cy="100" r="3" class="bullet" />
  <text x="85" y="95" class="step-title">1. 分配页表根页面</text>
  <text x="85" y="110" class="step-text">• 调用 kalloc() 分配一个物理页面</text>
  <text x="85" y="125" class="step-text">• 使用 memset() 将页面清零</text>
  
  <!-- 步骤2: 设备寄存器映射 -->
  <rect x="50" y="150" width="600" height="120" class="step-box" rx="3" />
  <circle cx="70" cy="170" r="3" class="bullet" />
  <text x="85" y="165" class="step-title">2. 设备寄存器映射 (kvmmap)</text>
  
  <rect x="70" y="180" width="560" height="25" class="sub-box" rx="2" />
  <text x="85" y="195" class="sub-item">• UART 寄存器</text>
  <text x="300" y="195" class="code">kvmmap(kpgtbl, UART0, UART0, PGSIZE, PTE_R | PTE_W)</text>
  
  <rect x="70" y="210" width="560" height="25" class="sub-box" rx="2" />
  <text x="85" y="225" class="sub-item">• VIRTIO 磁盘接口</text>
  <text x="300" y="225" class="code">kvmmap(kpgtbl, VIRTIO0, VIRTIO0, PGSIZE, PTE_R | PTE_W)</text>
  
  <rect x="70" y="240" width="560" height="25" class="sub-box" rx="2" />
  <text x="85" y="255" class="sub-item">• PLIC 中断控制器</text>
  <text x="300" y="255" class="code">kvmmap(kpgtbl, PLIC, PLIC, 0x400000, PTE_R | PTE_W)</text>
  
  <!-- 步骤3: 内核代码和数据映射 -->
  <rect x="50" y="290" width="600" height="120" class="step-box" rx="3" />
  <circle cx="70" cy="310" r="3" class="bullet" />
  <text x="85" y="305" class="step-title">3. 内核代码和数据映射</text>
  
  <rect x="70" y="320" width="560" height="25" class="sub-box" rx="2" />
  <text x="85" y="335" class="sub-item">• 内核代码段 (只读)</text>
  <text x="300" y="335" class="code">kvmmap(kpgtbl, KERNBASE, KERNBASE, (uint64)etext-KERNBASE, PTE_R | PTE_X)</text>
  
  <rect x="70" y="350" width="560" height="25" class="sub-box" rx="2" />
  <text x="85" y="365" class="sub-item">• 内核数据段 (可读写)</text>
  <text x="300" y="365" class="code">kvmmap(kpgtbl, (uint64)etext, (uint64)etext, PHYSTOP-(uint64)etext, PTE_R | PTE_W)</text>
  
  <rect x="70" y="380" width="560" height="25" class="sub-box" rx="2" />
  <text x="85" y="395" class="sub-item">• 物理内存映射</text>
  <text x="300" y="395" class="code">kvmmap(kpgtbl, TRAMPOLINE, (uint64)trampoline, PGSIZE, PTE_R | PTE_X)</text>
  
  <!-- 步骤4: 陷阱跳板映射 -->
  <rect x="50" y="430" width="600" height="50" class="step-box" rx="3" />
  <circle cx="70" cy="450" r="3" class="bullet" />
  <text x="85" y="445" class="step-title">4. 陷阱跳板映射</text>
  <text x="85" y="460" class="step-text">• 映射 trampoline 页面到虚拟地址空间最高处</text>
  <text x="85" y="475" class="step-text">• 用于用户态和内核态之间的切换</text>
  
  <!-- 步骤5: 进程内核栈分配 -->
  <rect x="50" y="500" width="600" height="70" class="step-box" rx="3" />
  <circle cx="70" cy="520" r="3" class="bullet" />
  <text x="85" y="515" class="step-title">5. 进程内核栈分配</text>
  <text x="85" y="530" class="step-text">• 调用 proc_mapstacks(kpgtbl) 为每个进程分配内核栈</text>
  <text x="85" y="545" class="step-text">• 每个进程都有独立的内核栈空间</text>
  <text x="85" y="560" class="step-text">• 栈之间有保护页防止溢出</text>
  
  <!-- 步骤6: 返回页表 -->
  <rect x="50" y="590" width="600" height="50" class="step-box" rx="3" />
  <circle cx="70" cy="610" r="3" class="bullet" />
  <text x="85" y="605" class="step-title">6. 返回内核页表</text>
  <text x="85" y="620" class="step-text">• 返回构建完成的内核页表 (pagetable_t)</text>
  <text x="85" y="635" class="step-text">• 页表已包含所有必要的内存映射</text>
  
  <!-- 关键特性说明 -->
  <rect x="50" y="660" width="600" height="100" class="header-box" rx="3" />
  <text x="70" y="680" class="step-title">关键特性：</text>
  <text x="70" y="700" class="step-text">✓ 直接映射：虚拟地址 = 物理地址 (简化地址转换)</text>
  <text x="70" y="715" class="step-text">✓ 权限分离：代码段只读可执行，数据段可读写</text>
  <text x="70" y="730" class="step-text">✓ 设备映射：MMIO 设备直接映射到虚拟地址空间</text>
  <text x="70" y="745" class="step-text">✓ 安全隔离：每个进程有独立的内核栈，防止栈溢出</text>
</svg>